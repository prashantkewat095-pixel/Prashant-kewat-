<script>
const heartContainer = document.getElementById("hearts");

const symbols = ["♡","♥","❤","💕","💗","💖"];

function createHeart() {
    const heart = document.createElement("div");

    heart.className = "heart";
    heart.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

    heart.style.left = Math.random() * 100 + "%";
    heart.style.fontSize = (12 + Math.random() * 28) + "px";

    const duration = 7 + Math.random() * 8;
    heart.style.animationDuration = duration + "s";

    heartContainer.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, duration * 1000);
}

for (let i = 0; i < 25; i++) {
    setTimeout(createHeart, i * 200);
}

setInterval(createHeart, 500);


/* 100% BUTTON */
function yesClicked() {
    document.getElementById("result").classList.add("show");
}


/* FOREVER BUTTON */
function foreverClicked() {
    document.getElementById("foreverPopup").classList.add("show");
}


/* CLOSE */
function closePopup() {
    document.getElementById("yesPopup").classList.remove("show");
    document.getElementById("foreverPopup").classList.remove("show");
}


/* BACK */
function backHome() {
    document.getElementById("result").classList.remove("show");
}
</script>
