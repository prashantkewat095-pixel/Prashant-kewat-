<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🌸 Motivation Seekh</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(145deg,#fff0f6,#fff9e8);
  color:#42243a;
}

main{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border:1px solid #efcadb;
  border-radius:22px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 7px 24px #73314a18;
}

h1{
  text-align:center;
  margin:5px;
}

.sub{
  text-align:center;
  color:#765f6d;
}

.day{
  text-align:center;
  color:#765f6d;
  margin-bottom:12px;
}

.lesson{
  font-size:24px;
  font-weight:bold;
  line-height:1.6;
  text-align:center;
  background:#fff4f8;
  border-radius:16px;
  padding:20px;
  margin:15px 0;
}

button{
  border:0;
  border-radius:13px;
  padding:12px 16px;
  margin:4px;
  background:#d65b9b;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.count{
  font-size:42px;
  text-align:center;
  color:#b52d70;
  font-weight:bold;
}

.options button{
  display:block;
  width:100%;
  text-align:left;
}

#feedback{
  font-weight:bold;
  min-height:25px;
  margin-top:10px;
}

#list{
  display:none;
  max-height:350px;
  overflow:auto;
}

#list p{
  padding:9px;
  margin:0;
  border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<main>

<div class="card">
<h1>🌸 Motivation Seekh</h1>

<div class="sub">
हर दिन नई Motivation • 1000+ सीख
</div>
</div>


<div class="card">

<div class="day" id="day"></div>

<div class="lesson" id="lesson"></div>

<div class="row">

<button onclick="previousLesson()">
⬅️ पिछली
</button>

<button onclick="nextLesson()">
अगली ➡️
</button>

<button onclick="randomLesson()">
🎲 Random
</button>

</div>

</div>


<div class="card">

<h2>🧠 आज का Quiz</h2>

<div id="question"></div>

<div class="options" id="options"></div>

<div id="feedback"></div>

</div>


<div class="card">

<div style="text-align:center">
<b>🌷 Radha Counter</b>
</div>

<div class="count" id="counter">
0
</div>

<div class="row">

<button onclick="addRadha()">
🙏 Radha नाम जोड़ें
</button>

</div>

</div>


<div class="card">

<button onclick="showAll()">
📚 सभी Motivation देखें
</button>

<div id="list"></div>

</div>

</main>


<script>

"अनुशासन बनाए रखो।",

"आज का काम आज करो।",
"अच्छी संगत चुनो।",
"नकारात्मक सोच से दूर रहो।",
"अपनी कमियों पर काम करो।",
"अपनी खूबियों को पहचानो।",
"धैर्य रखो।",
"जो शुरू किया है उसे पूरा करो।",
"हर दिन कुछ नया सीखो।",
"अभ्यास करते रहो।",

"अपनी प्रगति देखो।",
"एक समय में एक काम करो।",
"मुश्किल काम से भागो मत।",
"अपनी सोच को मजबूत बनाओ।",
"अपने वादे निभाओ।",
"समस्या का समाधान खोजो।",
"शांत रहकर फैसला लो।",

"सीखी बात को दोहराओ।",

"ईमानदार रहो।",
"किसी की मदद करो।",
"अपने स्वास्थ्य का ध्यान रखो।",
"फोन का सही उपयोग करो।",
"बहाने कम करो।",

"आज एक जरूरी काम पूरा करो।",

"हर सप्ताह अपनी प्रगति जाँचो।",
"हर महीने एक अच्छी आदत जोड़ो।",
"अपने लक्ष्य की वजह याद रखो।",
"आज को बेहतर बनाओ।",
"भविष्य के लिए तैयारी करो।",
"मेहनत के साथ सही दिशा चुनो।",
"अपने सपनों को योजना में बदलो।",
"अपना आत्मविश्वास बढ़ाओ।",
"अपने मन को सकारात्मक दिशा दो।",
"चुनौती को अवसर समझो।",
"एक और प्रयास करो।",
"अपनी यात्रा पर भरोसा रखो।"

];


/* =========================
   1000+ ENTRIES
   ========================= */

/*
हर entry में केवल एक ही सीख रहेगी।
कोई दो अलग बातें एक लाइन में नहीं जोड़ी जाएंगी।
*/

const lessons = [];

for(let i = 0; i < 1050; i++){

    lessons.push(
        motivation[i % motivation.length]
    );

}


/* =========================
   DAILY CHANGE
========================= */

function getToday(){

    const now = new Date();

    const start =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );

    return Math.floor(
        start.getTime() / 86400000
    );

}


/* आज की सीख */

let index =
    getToday() % lessons.length;


/* =========================
   SHOW MOTIVATION
========================= */

function displayLesson(){

    document.getElementById("day").innerText =
        "📅 आज की सीख • " +
        (index + 1) +
        " / " +
        lessons.length;

    document.getElementById("lesson").innerText =
        lessons[index];

}


/* अगली */

function nextLesson(){

    index++;

    if(index >= lessons.length){
        index = 0;
    }

    displayLesson();

}


/* पिछली */

function previousLesson(){

    index--;

    if(index < 0){
        index = lessons.length - 1;
    }

    displayLesson();

}


/* Random */

function randomLesson(){

    index =
        Math.floor(
            Math.random() * lessons.length
        );

    displayLesson();

}


/* =========================
   RADHA COUNTER
========================= */

let radha =
    Number(
        localStorage.getItem("radha_count") || 0
    );


function addRadha(){

    radha++;

    localStorage.setItem(
        "radha_count",
        radha
    );

    document.getElementById("counter")
        .innerText = radha;

}


/* =========================
   SHOW ALL
========================= */

function showAll(){

    const list =
        document.getElementById("list");

    if(list.style.display === "block"){

        list.style.display = "none";

        return;

    }

    list.style.display = "block";

    list.innerHTML = "";

    lessons.forEach(function(item,i){

        const p =
            document.createElement("p");

        p.innerHTML =
            "<b>" +
            (i + 1) +
            ".</b> " +
            item;

        list.appendChild(p);

    });

}


/* =========================
   QUIZ
========================= */

const quiz = [

[
"भारत की राजधानी क्या है?",
["मुंबई","नई दिल्ली","जयपुर"],
1
],

[
"सूर्य किस दिशा से उगता है?",
["पूर्व","पश्चिम","उत्तर"],
0
],

[
"एक सप्ताह में कितने दिन होते हैं?",
["5","7","10"],
1
],

[
"पानी का रासायनिक सूत्र क्या है?",
["CO2","H2O","O2"],
1
],

[
"पृथ्वी का प्राकृतिक उपग्रह कौन है?",
["चंद्रमा","सूर्य","मंगल"],
0
],

[
"भारत का राष्ट्रीय पशु कौन है?",
["शेर","बाघ","हाथी"],
1
],

[
"15 + 10 कितना होता है?",
["20","25","30"],
1
],

[
"भारत का राष्ट्रीय पक्षी कौन है?",
["मोर","तोता","हंस"],
0
]

];


function showQuiz(){

    const number =
        getToday() % quiz.length;

    const q =
        quiz[number];

    document.getElementById("question")
        .innerText = q[0];

    const box =
        document.getElementById("options");

    box.innerHTML = "";

    document.getElementById("feedback")
        .innerText = "";

    q[1].forEach(function(answer,i){

        const button =
            document.createElement("button");

        button.innerText = answer;

        button.onclick = function(){

            if(i === q[2]){

                document.getElementById(
                    "feedback"
                ).innerText =
                    "✅ सही जवाब!";

            }else{

                document.getElementById(
                    "feedback"
                ).innerText =
                    "❌ गलत! सही जवाब: " +
                    q[1][q[2]];

            }

        };

        box.appendChild(button);

    });

}


/* =========================
   START
========================= */

document.getElementById("counter")
    .innerText = radha;

displayLesson();

showQuiz();

</script>

</body>
</html>
