<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Motivation Seekh</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff0f7,#fff9e8);
  color:#42263b;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border:1px solid #ead3df;
  border-radius:24px;
  padding:22px;
  margin:16px 0;
  box-shadow:0 8px 25px rgba(80,30,60,.10);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#806574;
  font-size:16px;
}

.today{
  text-align:center;
  color:#b33c72;
  font-weight:bold;
  margin-bottom:15px;
}

.seekh{
  background:#fff1f7;
  border-radius:18px;
  padding:25px 15px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
  line-height:1.5;
  min-height:110px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.action{
  background:#fff8e8;
  padding:14px;
  border-radius:14px;
  margin-top:14px;
  text-align:center;
  line-height:1.5;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:15px;
}

button{
  border:none;
  border-radius:14px;
  padding:13px 18px;
  margin:5px;
  background:#cf5797;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

h2{
  margin-top:5px;
}

.quiz-question{
  font-size:20px;
  font-weight:bold;
  line-height:1.5;
  margin:15px 0;
}

.option{
  width:100%;
  text-align:left;
  background:#f3d8e6;
  color:#42263b;
}

.correct{
  background:#2e9b58 !important;
  color:white !important;
}

.wrong{
  background:#d94a59 !important;
  color:white !important;
}

.feedback{
  min-height:28px;
  font-weight:bold;
  margin-top:10px;
}

.counter{
  text-align:center;
}

.counter-title{
  font-size:19px;
  font-weight:bold;
}

.count{
  font-size:55px;
  font-weight:bold;
  color:#b52d70;
  margin:5px;
}

.small{
  color:#806574;
  font-size:14px;
}

.all-list{
  display:none;
  max-height:400px;
  overflow:auto;
  margin-top:15px;
}

.all-list p{
  padding:10px;
  margin:0;
  border-bottom:1px solid #eee;
  line-height:1.5;
}

.footer{
  text-align:center;
  color:#806574;
  padding:15px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="card">
    <div class="logo">🌸 Motivation Seekh</div>
    <div class="subtitle">
      हर दिन नई Motivation • 10,000+ सीख
    </div>
  </div>

  <!-- MOTIVATION -->
  <div class="card">

    <div class="today" id="today">
      📅 आज की सीख
    </div>

    <div class="seekh" id="seekh">
      अपनी दिनचर्या पर ध्यान दो।
    </div>

    <div class="action" id="action">
      आज की छोटी कोशिश: एक जरूरी काम समय पर पूरा करो।
    </div>

    <div class="buttons">
      <button onclick="previousSeekh()">⬅️ पिछली</button>
      <button onclick="nextSeekh()">अगली ➡️</button>
      <button onclick="randomSeekh()">🎲 Random</button>
    </div>

  </div>

  <!-- QUIZ -->
  <div class="card">

    <h2>🧠 आज का Quiz</h2>

    <div class="quiz-question" id="question">
      Quiz loading...
    </div>

    <div id="options"></div>

    <div class="feedback" id="feedback"></div>

  </div>

  <!-- RADHA COUNTER -->
  <div class="card counter">

    <div class="counter-title">
      🌷 Radha Counter
    </div>

    <div class="count" id="count">
      0
    </div>

    <div class="small">
      जितनी बार चाहो Radha नाम जोड़ सकते हो
    </div>

    <button onclick="addRadha()">
      🙏 Radha नाम जोड़ें
    </button>

    <br>

    <button onclick="resetRadha()">
      🔄 Counter Reset
    </button>

  </div>

  <!-- ALL MOTIVATION -->
  <div class="card">

    <div class="buttons">
      <button onclick="showAll()">
        📚 सभी Motivation देखें
      </button>
    </div>

    <div class="all-list" id="allList"></div>

  </div>

  <div class="footer">
    🌸 Motivation Seekh • रोज थोड़ा बेहतर बनो
  </div>

</div>


<script>

/* =====================================================

   ===================================================== */

  "अपनी सोच",
  "अपनी आदतों",

  "अपनी कोशिश",
  "अपने आत्मविश्वास",

  "अपने काम"

const actions = [
  "आज एक जरूरी काम पूरा करो।",
  "आज कम से कम 20 मिनट पढ़ाई करो।",
  "आज अपना समय बेकार मत जाने दो।",

  "आज कोई एक अच्छी आदत शुरू करो।",
  "आज अपना फोन कम इस्तेमाल करो।",
  "आज कल से थोड़ा बेहतर बनने की कोशिश करो।",
  "आज जो काम टाल रहे हो उसे शुरू करो।",
  "आज अपने लिए एक छोटा लक्ष्य बनाओ।",
  "आज कुछ नया सीखो।"
];

const endings = [
  "पर ध्यान दो।",
  "को मजबूत बनाओ।",
  "को सही दिशा दो।",
  "के लिए मेहनत करो।",
  "को समय दो।",
  "को बेहतर बनाओ।",
  "पर भरोसा रखो।",
  "से समझौता मत करो।",
  "को अपनी ताकत बनाओ।",
  "के लिए आज से शुरुआत करो।"
];


/*
  10,000+ सीखें automatically बनाई जाती हैं।
  हर लाइन अलग combination से बनती है।
*/

let lessons = [];

for(let i=0;i<10000;i++){

  let subject = subjects[i % subjects.length];
  let ending = endings[Math.floor(i / subjects.length) % endings.length];

  let number = i + 1;

  lessons.push(
    subject + " " + ending
  );
}


/* Extra अच्छी सीखें */

const specialLessons = [

"अपनी दिनचर्या पर ध्यान दो।",

"एक दिन सब बदलेगा।",
"अपने लक्ष्य पर ध्यान दो।",
"कुछ भी हो जाए, हार मत मानो।",
"आज से शुरुआत करो।",
"समय की कदर करो।",
"हर दिन थोड़ा बेहतर बनो।",
"अपने सपनों पर विश्वास रखो।",
"मुश्किलों से घबराओ मत।",
"लगातार आगे बढ़ते रहो।",
"अपनी गलतियों से सीखो।",
"अपने ऊपर भरोसा रखो।",
"काम को टालना बंद करो।",
"पढ़ाई को प्राथमिकता दो।",
"मेहनत को अपनी आदत बनाओ।",
"अनुशासन बनाए रखो।",
"छोटे कदम उठाते रहो।",
"अपना ध्यान भटकने मत दो।",
"आज का काम आज करो।",
"अच्छी संगत चुनो।",
"धैर्य रखो।",
"हर दिन कुछ नया सीखो।",
"अभ्यास करते रहो।",
"असफलता से सीखो।",
"दूसरों से तुलना मत करो।",
"खुद से बेहतर बनने की कोशिश करो।",
"अपना लक्ष्य लिखो।",
"अपनी प्रगति देखो।",
"मुश्किल काम से भागो मत।",
"अपने डर का सामना करो।",
"नई शुरुआत से मत डरो।",
"जरूरत हो तो मदद माँगो।",
"दूसरों का सम्मान करो।",
"ईमानदार रहो।",
"किसी की मदद करो।",
"अपने समय की योजना बनाओ।",
"बहाने कम करो।",
"कोशिश ज्यादा करो।",
"निरंतरता बनाए रखो।",
"अपनी प्राथमिकताएँ तय करो।",
"ध्यान लगाकर काम करो।",
"सीखने की इच्छा बनाए रखो।",
"चुनौती को अवसर समझो।",
"एक और प्रयास करो।",
"अपनी यात्रा पर भरोसा रखो।",
"रोज थोड़ा पढ़ो।",
"सवाल पूछने से मत डरो।",
"अपने फैसलों की जिम्मेदारी लो।",
"क्रोध में फैसला मत लो।",
"दूसरों की सफलता से प्रेरणा लो।",
"अपनी ऊर्जा सही जगह लगाओ।",
"जरूरी काम पहले करो।",
"छोटी जीत का सम्मान करो।",
"सही समय का इंतजार मत करो।",
"अपने सपनों को योजना दो।",
"योजना को काम में बदलो।",
"आज एक अच्छा काम करो।",
"अपने भविष्य के लिए आज काम करो।"

];


/* Special lessons को शुरुआत में डालना */

lessons = specialLessons.concat(lessons);


/* =====================================================
   DAILY MOTIVATION
   ===================================================== */

function getDayNumber(){

  const now = new Date();

  const start = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  return Math.floor(start.getTime()/86400000);

}


let currentIndex =
  getDayNumber() % lessons.length;


function showSeekh(){

  const text = lessons[currentIndex];

  document.getElementById("today").textContent =
    "📅 आज की सीख • " +
    (currentIndex + 1) +
    " / " +
    lessons.length;

  document.getElementById("seekh").textContent =
    text;

  document.getElementById("action").textContent =
    "🌱 आज की छोटी कोशिश: " +
    actions[currentIndex % actions.length];

}


function nextSeekh(){

  currentIndex++;

  if(currentIndex >= lessons.length){
    currentIndex = 0;
  }

  showSeekh();

}


function previousSeekh(){

  currentIndex--;

  if(currentIndex < 0){
    currentIndex = lessons.length - 1;
  }

  showSeekh();

}


function randomSeekh(){

  currentIndex =
    Math.floor(Math.random() * lessons.length);

  showSeekh();

}


/* =====================================================
   QUIZ
   ===================================================== */

const quizzes = [

{
 question:"भारत की राजधानी क्या है?",
 options:["मुंबई","नई दिल्ली","जयपुर"],
 answer:1
},

{
 question:"सूर्य किस दिशा से उगता है?",
 options:["पश्चिम","पूर्व","उत्तर"],
 answer:1
},

{
 question:"एक सप्ताह में कितने दिन होते हैं?",
 options:["5","7","10"],
 answer:1
},

{
 question:"पानी का रासायनिक सूत्र क्या है?",
 options:["CO2","H2O","O2"],
 answer:1
},

{
 question:"पृथ्वी का प्राकृतिक उपग्रह कौन है?",
 options:["चंद्रमा","सूर्य","मंगल"],
 answer:0
},

{
 question:"भारत का राष्ट्रीय पशु कौन है?",
 options:["हाथी","बाघ","शेर"],
 answer:1
},

{
 question:"एक वर्ष में कितने महीने होते हैं?",
 options:["10","11","12"],
 answer:2
},

{
 question:"इंद्रधनुष में कितने रंग होते हैं?",
 options:["5","7","9"],
 answer:1
},

{
 question:"भारत का राष्ट्रीय पक्षी कौन है?",
 options:["मोर","तोता","कबूतर"],
 answer:0
},

{
 question:"पौधे प्रकाश संश्लेषण में किस गैस का उपयोग करते हैं?",
 options:["ऑक्सीजन","कार्बन डाइऑक्साइड","नाइट्रोजन"],
 answer:1
}

];


function showQuiz(){

  const quiz =
    quizzes[getDayNumber() % quizzes.length];

  document.getElementById("question").textContent =
    quiz.question;

  const optionsBox =
    document.getElementById("options");

  optionsBox.innerHTML="";

  document.getElementById("feedback").textContent="";

  quiz.options.forEach((option,index)=>{

    const button =
      document.createElement("button");

    button.className="option";

    button.textContent=option;

    button.onclick=function(){

      const allButtons =
        optionsBox.querySelectorAll("button");

      allButtons.forEach(btn=>{
        btn.disabled=true;
      });

      if(index === quiz.answer){

        button.classList.add("correct");

        document.getElementById("feedback").textContent =
          "✅ बिल्कुल सही जवाब!";

      }else{

        button.classList.add("wrong");

        allButtons[quiz.answer].classList.add("correct");

        document.getElementById("feedback").textContent =
          "❌ गलत जवाब। सही उत्तर हरे रंग में है।";

      }

    };

    optionsBox.appendChild(button);

  });

}


/* =====================================================
   RADHA COUNTER
   ===================================================== */

let radhaCount =
  Number(localStorage.getItem("radhaCount") || 0);


function updateCounter(){

  document.getElementById("count").textContent =
    radhaCount;

}


function addRadha(){

  radhaCount++;

  localStorage.setItem(
    "radhaCount",
    radhaCount
  );

  updateCounter();

}


function resetRadha(){

  if(confirm("क्या आप Radha Counter को 0 करना चाहते हैं?")){

    radhaCount=0;

    localStorage.setItem(
      "radhaCount",
      0
    );

    updateCounter();

  }

}


/* =====================================================
   ALL MOTIVATION
   ===================================================== */

function showAll(){

  const box =
    document.getElementById("allList");

  if(box.style.display === "block"){

    box.style.display="none";

    return;

  }

  box.style.display="block";

  box.innerHTML="";

  lessons.forEach((lesson,index)=>{

    const p =
      document.createElement("p");

    p.innerHTML =
      "<b>"+(index+1)+".</b> "+lesson;

    box.appendChild(p);

  });

}


/* =====================================================
   START
   ===================================================== */

showSeekh();

showQuiz();

updateCounter();

</script>

</body>
</html>
