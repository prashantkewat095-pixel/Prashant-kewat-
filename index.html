<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Late Night Talks?</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 50% 40%, #ff4f91 0%, #c91862 35%, #650d3e 70%, #24051e 100%);
}

/* Glow */
body::before {
    content: "";
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: rgba(255, 105, 180, 0.35);
    filter: blur(80px);
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
}

/* Floating hearts */
.hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.heart {
    position: absolute;
    bottom: -60px;
    color: rgba(255, 255, 255, 0.75);
    font-size: 22px;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,255,255,.5));
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg) scale(.8);
        opacity: 0;
    }
    15% {
        opacity: 1;
    }
    100% {
        transform: translateY(-115vh) rotate(360deg) scale(1.4);
        opacity: 0;
    }
}

/* Main card */
.card {
    position: relative;
    z-index: 5;
    width: min(88%, 390px);
    padding: 42px 25px 32px;
    text-align: center;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255,255,255,.3);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.25);
}

/* Moon */
.moon {
    width: 72px;
    height: 72px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: #fff4fb;
    box-shadow:
        0 0 20px #fff,
        0 0 45px rgba(255,255,255,.7);
    position: relative;
    overflow: hidden;
}

.moon::after {
    content: "";
    position: absolute;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #8e1c58;
    top: -12px;
    left: 25px;
}

/* Text */
h1 {
    color: white;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: .5px;
    text-shadow: 0 2px 15px rgba(0,0,0,.3);
    margin-bottom: 10px;
}

.subtitle {
    color: rgba(255,255,255,.9);
    font-size: 15px;
    margin-bottom: 28px;
}

/* Buttons */
.buttons {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

button {
    width: 100%;
    border: none;
    padding: 15px 20px;
    border-radius: 50px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .25s ease;
    font-family: inherit;
}

.yes {
    background: white;
    color: #d51d6b;
    box-shadow: 0 8px 25px rgba(0,0,0,.2);
}

.forever {
    background: rgba(255,255,255,.15);
    color: white;
    border: 1px solid rgba(255,255,255,.5);
}

button:hover {
    transform: scale(1.04);
}

button:active {
    transform: scale(.96);
}

/* Instagram */
.instagram {
    margin-top: 25px;
    color: rgba(255,255,255,.8);
    font-size: 13px;
}

.instagram span {
    color: white;
    font-weight: bold;
}

/* Popup */
.message {
    position: fixed;
    z-index: 20;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(20,0,15,.55);
    backdrop-filter: blur(8px);
}

.message-box {
    width: min(85%, 350px);
    padding: 35px 25px;
    text-align: center;
    border-radius: 25px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.4);
    color: white;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.message-box h2 {
    margin-bottom: 12px;
    font-size: 28px;
}

.message-box p {
    line-height: 1.5;
    margin-bottom: 22px;
}

.close {
    width: auto;
    padding: 11px 28px;
    background: white;
    color: #d51d6b;
}

/* Mobile */
@media (max-width: 400px) {
    h1 {
        font-size: 28px;
    }

    .card {
        padding: 35px 20px 28px;
    }
}
</style>
</head>

<body>

<!-- Floating hearts -->
<div class="hearts" id="hearts"></div>

<!-- Main card -->
<div class="card">

    <div class="moon"></div>

    <h1>Late Night Talks?</h1>

    <div class="subtitle">
        Just you, me & a little midnight magic 🌙
    </div>

    <div class="buttons">
        <button class="yes" onclick="showMessage('yes')">
            100% 💗
        </button>

        <button class="forever" onclick="showMessage('forever')">
            FOREVER ✨
        </button>
    </div>

    <div class="instagram">
        made with ♡ by <span>@yourusername</span>
    </div>

</div>

<!-- Popup -->
<div class="message" id="message">

    <div class="message-box">

        <h2 id="messageTitle">💗</h2>

        <p id="messageText"></p>

        <button class="close" onclick="closeMessage()">
            Close
        </button>

    </div>

</div>

<script>

/* Create floating hearts */
const hearts = document.getElementById("hearts");

const heartSymbols = ["♥", "♡", "❤", "💕", "💗"];

for (let i = 0; i < 35; i++) {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML =
        heartSymbols[Math.floor(Math.random() * heartSymbols.length)];

    heart.style.left = Math.random() * 100 + "%";

    heart.style.fontSize =
        (12 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (6 + Math.random() * 8) + "s";

    heart.style.animationDelay =
        (Math.random() * 8) + "s";

    hearts.appendChild(heart);
}


/* Button messages */
function showMessage(type) {

    const popup = document.getElementById("message");
    const title = document.getElementById("messageTitle");
    const text = document.getElementById("messageText");

    if (type === "yes") {

        title.innerHTML = "💗 Yayyy!";

        text.innerHTML =
            "Then let's make tonight a little more special ✨🌙";

    } else {

        title.innerHTML = "∞ FOREVER ∞";

        text.innerHTML =
            "Some conversations are worth staying up for. 💕";

    }

    popup.style.display = "flex";
}


/* Close popup */
function closeMessage() {

    document.getElementById("message").style.display = "none";

}

</script>

</body>
</html>
