<title>Prashant Hub 🚀</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Arial,sans-serif;
  background:#080b14;
  color:white;
  line-height:1.6;
}
nav{
  position:sticky;top:0;z-index:99;
  background:rgba(8,11,20,.9);
  backdrop-filter:blur(12px);
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #252b3d;
}
.logo{font-size:23px;font-weight:bold}
nav a{
  color:#bbb;text-decoration:none;margin-left:14px;
  font-size:14px;
}
nav a:hover{color:#6ea8ff}

.hero{
  min-height:85vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px 20px;
  background:
  radial-gradient(circle at top,#253d70 0,#080b14 55%);
}
.badge{
  background:#17243f;
  border:1px solid #3d65a5;
  padding:8px 16px;
  border-radius:30px;
  margin-bottom:20px;
}
.hero h1{font-size:clamp(42px,10vw,75px)}
.hero h1 span{color:#67a5ff}
.hero p{max-width:600px;color:#b9c0d0;margin:15px 0 25px}
.btn{
  display:inline-block;
  padding:13px 22px;
  border-radius:12px;
  background:#3978ff;
  color:white;
  text-decoration:none;
  border:0;
  cursor:pointer;
  font-weight:bold;
  margin:5px;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.15)}

section{padding:65px 20px;max-width:1100px;margin:auto}
.title{text-align:center;font-size:34px;margin-bottom:35px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}
.card{
  background:#111625;
  border:1px solid #252d42;
  padding:25px;
  border-radius:20px;
  transition:.25s;
}
.card:hover{
  transform:translateY(-6px);
  border-color:#4d82ff;
  box-shadow:0 10px 35px #0006;
}
