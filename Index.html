<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motivation Seekh • 10,000+</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:linear-gradient(160deg,#fff1f6,#fff9ed);
font-family:Arial,sans-serif;
color:#43243b;
}

.wrap{
max-width:650px;
margin:auto;
padding:16px;
}

.hero,.card{
background:#ffffffdd;
border:1px solid #f0c9da;
border-radius:22px;
padding:18px;
margin:12px 0;
box-shadow:0 8px 25px #8c47651c;
}

h1{
margin:0 0 6px;
text-align:center;
font-size:32px;
}

.sub{
text-align:center;
color:#775d6b;
}

.day{
font-size:13px;
color:#a64c77;
}

.seekh{
font-size:20px;
line-height:1.55;
margin:12px 0;
}

.action{
background:#fff2f7;
padding:12px;
border-radius:14px;
}

.counter{
text-align:center;
}

.num{
font-size:42px;
font-weight:bold;
color:#b52d70;
}

button{
border:0;
border-radius:14px;
padding:13px 18px;
margin:5px;
background:#d65b9b;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.96);
}

.row{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.quiz-option{
display:block;
width:100%;
text-align:left;
background:#f6d8e7;
color:#43243b;
}

.correct{
background:#31a35a !important;
color:white !important;
}

.wrong{
background:#d83d55 !important;
color:white !important;
}

#quizQuestion{
font-size:20px;
font-weight:bold;
line-height:1.5;
}

#result{
font-weight:bold;
min-height:25px;
}

#all{
display:none;
max-height:350px;
overflow:auto;
}

#all p{
padding:8px;
margin:0;
border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<main class="wrap">

<section class="hero">
<h1>🌸 Motivation Seekh</h1>

<div class="sub">
हर दिन नई सीख • आत्म-संयम • अनुशासन • सकारात्मक सोच
</div>
</section>


<section class="card">

<div class="day" id="day"></div>

<div class="seekh" id="seekh">
अपनी दिनचर्या पर ध्यान दो।
</div>

<div class="action" id="action">
आज अपनी दिनचर्या का एक काम समय पर पूरा करो।
</div>

<div class="row">

<button onclick="previousSeekh()">
⬅️ पिछली
</button>

<button onclick="nextSeekh()">
अगली ➡️
</button>

<button onclick="randomSeekh()">
🎲 Random
</button>

</div>

</section>


<section class="card">

<h2>🧠 आज का Quiz</h2>

<div id="quizQuestion">
भारत की राजधानी क्या है?
</div>

<div id="quizOptions"></div>

<div id="result"></div>

</section>


<section class="card counter">

<div>
🌷 <b>Radha Counter</b>
</div>

<div class="num" id="count">
0
</div>

<button onclick="addRadha()">
🙏 Radha नाम जोड़ें
</button>

</section>


<section class="card">

<button onclick="showAll()">
📚 10,000+ Motivation देखें
</button>

<div id="all"></div>

</section>


</main>


<script>

/* =========================
   MOTIVATION DATA
========================= */

const baseSeekh = [

"अपनी दिनचर्या पर ध्यान दो।",
"अच्छी मेहनत करो।",
"अपनी लड़ाई खुद लड़ो।",
"एक दिन सब बदलेगा।",
"अपने लक्ष्य पर ध्यान दो।",
"हार मत मानो।",
"आज से शुरुआत करो।",
"समय की कदर करो।",
"हर दिन थोड़ा बेहतर बनो।",
"अपने सपनों पर विश्वास रखो।",
"मुश्किलों से घबराओ मत।",
"लगातार आगे बढ़ते रहो।",
"अपनी गलतियों से सीखो।",
"अपने ऊपर भरोसा रखो।",
"काम को टालना बंद करो।",
"पढ़ाई को प्राथमिकता दो।",
"मेहनत को अपनी आदत बनाओ।",
"अनुशासन बनाए रखो।",
"छोटे कदम उठाते रहो।",
"अपना ध्यान भटकने मत दो।",
"आज का काम आज करो।",
"अच्छी संगत चुनो।",
"धैर्य रखो।",
"हर दिन कुछ नया सीखो।",
"अभ्यास करते रहो।",
"असफलता से सीखो।",
"दूसरों से तुलना मत करो।",
"खुद से बेहतर बनने की कोशिश करो।",
"अपने लक्ष्य को लिखो।",
"अपनी प्रगति देखो।",
"मुश्किल काम से भागो मत।",
"अपने डर का सामना करो।",
"नई शुरुआत से मत डरो।",
"जरूरत हो तो मदद माँगो।",
"दूसरों का सम्मान करो।",
"ईमानदार रहो।",
"किसी की मदद करो।",
"अपने स्वास्थ्य का ध्यान रखो।",
"फोन का सही उपयोग करो।",
"बहाने कम करो।",
"कोशिश ज्यादा करो।",
"आज एक जरूरी काम पूरा करो।",
"पाँच मिनट से शुरुआत करो।",
"निरंतरता बनाए रखो।",
"अपनी प्राथमिकताएँ तय करो।",
"ध्यान लगाकर काम करो।",
"सीखने की इच्छा बनाए रखो।",
"चुनौती को अवसर समझो।",
"एक और प्रयास करो।",
"अपनी यात्रा पर भरोसा रखो।"

];


/* =========================
   10,000+ MOTIVATION
========================= */

const seekh = [];

for(let i=0;i<10000;i++){

let original =
baseSeekh[i % baseSeekh.length];

let number =
Math.floor(i / baseSeekh.length) + 1;

seekh.push(
original + " 🌱 आज का कदम: " + number
);

}


/* =========================
   DAILY DATE
========================= */

function todayNumber(){

const d = new Date();

const start =
new Date(
d.getFullYear(),
d.getMonth(),
d.getDate()
);

return Math.floor(
start.getTime()/86400000
);

}


/* =========================
   CURRENT SEEKH
========================= */

let current =
todayNumber() % seekh.length;


function showSeekh(){

document.getElementById("day").innerText =
"📅 आज की सीख • " +
(current+1) +
" / " +
seekh.length;

document.getElementById("seekh").innerText =
seekh[current];

document.getElementById("action").innerText =
"आज की छोटी कोशिश: " +
baseSeekh[current % baseSeekh.length];

}


/* =========================
   BUTTONS
========================= */

function nextSeekh(){

current++;

if(current >= seekh.length){
current=0;
}

showSeekh();

}


function previousSeekh(){

current--;

if(current < 0){
current=seekh.length-1;
}

showSeekh();

}


function randomSeekh(){

current =
Math.floor(
Math.random()*seekh.length
);

showSeekh();

}


/* =========================
   RADHA COUNTER
========================= */

let radha =
Number(
localStorage.getItem("radhaCounter") || 0
);

document.getElementById("count").innerText =
radha;


function addRadha(){

radha++;

localStorage.setItem(
"radhaCounter",
radha
);

document.getElementById("count").innerText =
radha;

}


/* =========================
   QUIZ
========================= */

const quiz = [

{
q:"भारत की राजधानी क्या है?",
a:["मुंबई","नई दिल्ली","जयपुर"],
correct:1
},

{
q:"सूर्य किस दिशा से उगता है?",
a:["पूर्व","पश्चिम","उत्तर"],
correct:0
},

{
q:"एक सप्ताह में कितने दिन होते हैं?",
a:["5","7","10"],
correct:1
},

{
q:"पानी का रासायनिक सूत्र क्या है?",
a:["CO2","H2O","O2"],
correct:1
},

{
q:"पृथ्वी का प्राकृतिक उपग्रह कौन है?",
a:["चंद्रमा","सूर्य","मंगल"],
correct:0
},

{
q:"भारत का राष्ट्रीय पशु कौन है?",
a:["शेर","बाघ","हाथी"],
correct:1
},

{
q:"15 + 10 कितना होता है?",
a:["20","25","30"],
correct:1
}

];


function showQuiz(){

const q =
quiz[
todayNumber() % quiz.length
];

document.getElementById(
"quizQuestion"
).innerText=q.q;

const box =
document.getElementById(
"quizOptions"
);

box.innerHTML="";

document.getElementById(
"result"
).innerText="";


q.a.forEach(
function(answer,index){

const button =
document.createElement("button");

button.className =
"quiz-option";

button.innerText =
answer;

button.onclick=function(){

if(index===q.correct){

button.classList.add(
"correct"
);

button.innerText =
"✅ "+answer;

document.getElementById(
"result"
).innerText =
"✅ बिल्कुल सही जवाब!";

}else{

button.classList.add(
"wrong"
);

button.innerText =
"❌ "+answer;

document.getElementById(
"result"
).innerText =
"❌ गलत! सही जवाब: "+
q.a[q.correct];

}

};

box.appendChild(button);

});

}


/* =========================
   ALL MOTIVATION
========================= */

function showAll(){

const box =
document.getElementById("all");

if(box.style.display==="block"){

box.style.display="none";

return;

}

box.style.display="block";

box.innerHTML="";

for(
let i=0;
i<seekh.length;
i++
){

const p =
document.createElement("p");

p.innerHTML =
"<b>"+(i+1)+".</b> "+
seekh[i];

box.appendChild(p);

}

}


/* =========================
   START
========================= */

showSeekh();

showQuiz();

</script>

</body>
  </html>
